[build]
  publish = "public"
  command = 'echo "window.CONFIG = { WS_URL: \"$WS_URL\" };" > public/config.js'

[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = """
      default-src 'self';
      script-src 'self';
      style-src 'self' 'unsafe-inline';
      img-src 'self' data:;
      font-src 'self';
      connect-src 'self' wss://chess-chessy.up.railway.app;
      object-src 'none';
      base-uri 'self';
      form-action 'self';
      frame-ancestors 'none'
    """
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"